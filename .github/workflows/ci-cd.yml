# -----------------------------------------------------------------------
# PLAIN ENGLISH: This is the assembly line that turns a code change into
# a safely running application. It runs automatically every time code
# is pushed. Each stage is a checkpoint: if tests fail, the pipeline
# stops before a broken image is ever built. If a security scan finds a
# critical vulnerability, it stops before that image is ever deployed.
# If Terraform would create something insecure, the OPA policy gate
# blocks it before `apply` ever runs. Only after every checkpoint
# passes does the pipeline gradually roll the new version out to real
# traffic ("canary"), watch it, and promote it — or automatically back
# out if something looks wrong. This is what turns "deployment fear"
# into a routine, boring, low-risk event.
#
# Authentication note: this workflow authenticates to AWS using OpenID
# Connect (OIDC) — see terraform/modules/iam-oidc. There are no AWS
# access keys stored as GitHub secrets anywhere in this pipeline.
# -----------------------------------------------------------------------
name: CloudPulse CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # required for OIDC -> AWS
  contents: read
  security-events: write

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: cloudpulse-app
  EKS_CLUSTER_NAME: cloudpulse-dev

jobs:
  # -----------------------------------------------------------------
  # Stage 1: test the application code itself.
  # -----------------------------------------------------------------
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run tests
        working-directory: app
        run: npm test

  # -----------------------------------------------------------------
  # Stage 2: validate Terraform and gate it with OPA policy-as-code
  # BEFORE anything is ever applied to AWS.
  # -----------------------------------------------------------------
  terraform-plan-and-policy-gate:
    name: Terraform plan + OPA policy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: terraform/environments/dev
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: terraform/environments/dev
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform/environments/dev
        run: terraform plan -input=false -out=tfplan

      - name: Convert plan to JSON
        working-directory: terraform/environments/dev
        run: terraform show -json tfplan > tfplan.json

      - name: Install conftest
        run: |
          curl -sSL -o conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_Linux_x86_64.tar.gz
          tar xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin

      - name: Run OPA policy gate against the plan
        working-directory: terraform/environments/dev
        run: conftest test tfplan.json -p ../../../policies/opa/terraform

  # -----------------------------------------------------------------
  # Stage 3: build the container image, scan it, and generate an SBOM
  # (a signed "ingredients label" listing every dependency inside it).
  # -----------------------------------------------------------------
  build-scan-sbom:
    name: Build, scan, and generate SBOM
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Compute image tag
        run: echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build image
        working-directory: app
        run: docker build -t cloudpulse-app:${{ steps.meta.outputs.image_tag }} .

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: cloudpulse-app:${{ steps.meta.outputs.image_tag }}
          severity: CRITICAL,HIGH
          exit-code: "1" # fail the pipeline on critical/high findings

      - name: Generate SBOM (Syft, CycloneDX format)
        uses: anchore/sbom-action@v0
        with:
          image: cloudpulse-app:${{ steps.meta.outputs.image_tag }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.meta.outputs.image_tag }}
          path: sbom.cyclonedx.json
          retention-days: 90

      - name: Configure AWS credentials (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Push image to ECR
        if: github.ref == 'refs/heads/main'
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ vars.ECR_REGISTRY }}
          docker tag cloudpulse-app:${{ steps.meta.outputs.image_tag }} ${{ vars.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}
          docker push ${{ vars.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}

  # -----------------------------------------------------------------
  # Stage 4: canary deploy. Ship the new version to a small slice of
  # traffic first, watch it, then promote to 100% — or automatically
  # roll back if it looks unhealthy.
  # -----------------------------------------------------------------
  canary-deploy:
    name: Canary deploy to EKS
    runs-on: ubuntu-latest
    needs: [build-scan-sbom, terraform-plan-and-policy-gate]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Gate manifests with OPA before they ever reach the cluster
        run: |
          curl -sSL -o conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_Linux_x86_64.tar.gz
          tar xzf conftest.tar.gz && sudo mv conftest /usr/local/bin
          kubectl kustomize k8s/overlays/production > /tmp/rendered.yaml
          conftest test /tmp/rendered.yaml -p policies/opa/kubernetes

      - name: Deploy canary (10% of replicas on the new version)
        run: |
          IMAGE="${{ vars.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-scan-sbom.outputs.image_tag }}"
          kubectl set image deployment/cloudpulse-app-canary cloudpulse-app="$IMAGE" -n cloudpulse-production || \
            echo "Canary deployment not yet initialized; first deploy creates it via kustomize apply."
          kubectl apply -k k8s/overlays/production -n cloudpulse-production

      - name: Watch canary health for 2 minutes
        run: |
          echo "Watching rollout status and pod health before promoting..."
          kubectl rollout status deployment/cloudpulse-app -n cloudpulse-production --timeout=120s

      - name: Roll back automatically if the canary is unhealthy
        if: failure()
        run: |
          echo "Canary looked unhealthy — rolling back to the previous known-good revision."
          kubectl rollout undo deployment/cloudpulse-app -n cloudpulse-production

      - name: Promote canary to 100%
        if: success()
        run: |
          echo "Canary healthy — full rollout complete."
